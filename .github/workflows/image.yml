name: image
# Builds the container image and publishes it to GHCR, tagged with the commit
# SHA (immutable; what servers pin) and, on main, also `main`.
# Run it by hand on any branch with "Run workflow".
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          img=ghcr.io/${GITHUB_REPOSITORY,,}
          tags="$img:sha-${GITHUB_SHA::12}"
          if [[ $GITHUB_REF == refs/heads/main ]]; then tags+=",$img:main"; fi
          if [[ $GITHUB_REF == refs/tags/v* ]]; then tags+=",$img:${GITHUB_REF_NAME}"; fi
          echo "tags=$tags" >>"$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
